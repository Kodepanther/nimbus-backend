trigger:
  branches:
    include:
      - main
      - dev
  paths:
    exclude:
      - README.md
      - .gitignore
      - '*.md'

pr:
  branches:
    include:
      - main
  paths:
    exclude:
      - README.md
      - .gitignore
      - '*.md'

variables:
  nodeVersion: '18.x'
  devWebAppName: 'nimbus-notes-backend-dev'
  devResourceGroup: 'rg-nimbus-dev'
  stagingWebAppName: 'landing-page-backend-staging'
  stagingResourceGroup: 'landing-page-staging-rg'
  workingDirectory: '$(System.DefaultWorkingDirectory)'

stages:
- stage: Build
  displayName: 'Build and Test'
  jobs:
    - job: BuildJob
      displayName: 'Build Application'
      pool:
        name: 'SandboxAgent'
      steps:
        - task: NodeTool@0
          displayName: 'Install Node.js $(nodeVersion)'
          inputs:
            versionSpec: $(nodeVersion)

        - script: |
            echo 📦 Installing dependencies...
            npm ci
          displayName: 'npm install'
          workingDirectory: $(workingDirectory)

        - script: |
            echo 🧪 Running tests...
            REM npm test (uncomment when you add tests)
            echo No tests configured yet
          displayName: 'Run Tests'
          workingDirectory: $(workingDirectory)
          continueOnError: true

        - script: |
            echo 📋 Application Information:
            node --version
            npm --version
            echo Build ID: $(Build.BuildId)
            echo Branch: $(Build.SourceBranchName)
          displayName: 'Display Build Info'

        - task: ArchiveFiles@2
          displayName: '📦 Create Deployment Package'
          inputs:
            rootFolderOrFile: '$(workingDirectory)'
            includeRootFolder: false
            archiveType: 'zip'
            archiveFile: '$(Build.ArtifactStagingDirectory)/backend-$(Build.BuildId).zip'
            replaceExistingArchive: true
            verbose: true

        - task: PublishBuildArtifacts@1
          displayName: '📤 Publish Build Artifact'
          inputs:
            PathtoPublish: '$(Build.ArtifactStagingDirectory)'
            ArtifactName: 'backend-drop'
            publishLocation: 'Container'

- stage: DeployDevelopment
  displayName: 'Deploy to Development'
  dependsOn: Build
  condition: |
    and(
      succeeded(),
      eq(variables['Build.Reason'], 'IndividualCI'),
      or(
        eq(variables['Build.SourceBranchName'], 'main'),
        eq(variables['Build.SourceBranchName'], 'dev')
      )
    )
  jobs:
    - deployment: DeployDev
      displayName: 'Deploy to Development Environment'
      environment: 'development'
      pool:
        name: 'SandboxAgent'
      strategy:
        runOnce:
          deploy:
            steps:
              - task: DownloadBuildArtifacts@1
                displayName: '⬇️ Download Build Artifact'
                inputs:
                  buildType: 'current'
                  downloadType: 'single'
                  artifactName: 'backend-drop'
                  downloadPath: '$(System.ArtifactsDirectory)'

              - task: AzureWebApp@1
                displayName: '🚀 Deploy to Development Web App'
                inputs:
                  azureSubscription: 'nimbus-azure-connection'
                  appType: 'webAppLinux'
                  appName: '$(devWebAppName)'
                  resourceGroupName: '$(devResourceGroup)'
                  package: '$(System.ArtifactsDirectory)/backend-drop/backend-$(Build.BuildId).zip'
                  runtimeStack: 'NODE|18-lts'
                  startUpCommand: 'npm start'

              - script: |
                  echo ✅ Deployment to Development completed!
                  echo 🌐 URL: https://$(devWebAppName).azurewebsites.net
                  echo 📊 Testing health endpoint...
                  timeout /t 10
                  powershell -Command "Invoke-WebRequest -Uri https://$(devWebAppName).azurewebsites.net/health -UseBasicParsing"
                displayName: '✅ Post-Deployment Verification'

- stage: DeployStaging
  displayName: 'Deploy to Staging'
  dependsOn: DeployDevelopment
  condition: |
    and(
      succeeded(),
      eq(variables['Build.Reason'], 'PullRequest'),
      eq(variables['System.PullRequest.TargetBranch'], 'refs/heads/main')
    )
  jobs:
    - deployment: DeployStaging
      displayName: 'Deploy to Staging Environment'
      environment: 'staging'
      pool:
        name: 'SandboxAgent'
      strategy:
        runOnce:
          deploy:
            steps:
              - task: DownloadBuildArtifacts@1
                displayName: '⬇️ Download Build Artifact'
                inputs:
                  buildType: 'current'
                  downloadType: 'single'
                  artifactName: 'backend-drop'
                  downloadPath: '$(System.ArtifactsDirectory)'

              - task: AzureWebApp@1
                displayName: '🚀 Deploy to Staging Web App'
                inputs:
                  azureSubscription: 'nimbus-azure-connection'
                  appType: 'webAppLinux'
                  appName: '$(stagingWebAppName)'
                  resourceGroupName: '$(stagingResourceGroup)'
                  package: '$(System.ArtifactsDirectory)/backend-drop/backend-$(Build.BuildId).zip'
                  runtimeStack: 'NODE|18-lts'
                  startUpCommand: 'npm start'

              - script: |
                  echo ✅ Deployment to Staging completed!
                  echo 🌐 URL: https://$(stagingWebAppName).azurewebsites.net
                  echo 📊 Testing health endpoint...
                  timeout /t 10
                  powershell -Command "Invoke-WebRequest -Uri https://$(stagingWebAppName).azurewebsites.net/health -UseBasicParsing"
                displayName: '✅ Post-Deployment Verification'

              - script: |
                  echo 📝 Staging Deployment Summary:
                  echo ========================================
                  echo Pull Request: $(System.PullRequest.PullRequestNumber)
                  echo Source Branch: $(System.PullRequest.SourceBranch)
                  echo Target Branch: $(System.PullRequest.TargetBranch)
                  echo Deployed to: https://$(stagingWebAppName).azurewebsites.net
                  echo ========================================
                displayName: '📝 Display PR Info'